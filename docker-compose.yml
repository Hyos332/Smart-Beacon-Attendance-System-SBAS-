services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sbas-postgres
    environment:
      POSTGRES_USER: sbas_user
      POSTGRES_PASSWORD: sbas_password_dev
      POSTGRES_DB: sbas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbas_user -d sbas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./sbas/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - BEACON_MODE=simulate  # Cambiar a 'real' para BLE verdadero
      - DATABASE_URL=postgresql://sbas_user:sbas_password_dev@postgres:5432/sbas_db?schema=public
      - JWT_SECRET=dev_jwt_secret_change_in_production
    volumes:
      - backend-data:/app/data
      - /var/run/dbus:/var/run/dbus  # Para acceso BLE
    privileged: true  # Necesario para BLE real
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend-teacher:
    build:
      context: ./sbas/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - PORT=3000
    volumes:
      - ./sbas/frontend:/app
      - /app/node_modules
    restart: unless-stopped

  webapp-student:
    build: ./sbas/webapp_student
    ports:
      - "3001:3001"  
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - PORT=3001    
    volumes:
      - ./sbas/webapp_student:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:

networks:
  default:
    driver: bridge